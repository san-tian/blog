<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg-gradient)"/>

  <!-- Title Card -->
  <rect x="40" y="60" width="1000" height="280" rx="20" fill="white" opacity="0.95"/>
  <text x="540" y="140" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" fill="url(#title-gradient)" text-anchor="middle">MTP 为什么会让</text>
  <text x="540" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" fill="url(#title-gradient)" text-anchor="middle">上下文减小？</text>
  <text x="540" y="280" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#78716c" text-anchor="middle">KV cache 开销图解</text>

  <!-- Main Visual: Memory Bar Comparison -->
  <rect x="80" y="420" width="920" height="580" rx="16" fill="white" opacity="0.95"/>

  <text x="540" y="480" font-family="PingFang SC, sans-serif" font-size="32" font-weight="600" fill="#1c1917" text-anchor="middle">显存分配对比</text>

  <!-- Base Model -->
  <text x="120" y="550" font-family="PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#2563eb">Base 模型（无 MTP）</text>
  <rect x="120" y="570" width="840" height="60" rx="8" fill="#2563eb"/>
  <text x="540" y="610" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600" fill="white" text-anchor="middle">主干 N 层 KV Cache</text>
  <text x="120" y="660" font-family="PingFang SC, sans-serif" font-size="20" fill="#059669" font-weight="600">✓ 可用上下文 = 100%</text>

  <!-- GLM-5.2 with MTP -->
  <text x="120" y="740" font-family="PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#dc2626">GLM-5.2（开启 MTP）</text>
  <rect x="120" y="760" width="705" height="60" rx="8" fill="#2563eb"/>
  <rect x="825" y="760" width="50" height="60" rx="8" fill="#dc2626"/>
  <rect x="875" y="760" width="85" height="60" rx="8" fill="#d97706"/>
  <text x="472" y="800" font-family="PingFang SC, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">主干 KV (84%)</text>
  <text x="850" y="800" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">MTP</text>
  <text x="917" y="800" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">草稿峰值</text>
  <text x="120" y="850" font-family="PingFang SC, sans-serif" font-size="20" fill="#dc2626" font-weight="600">⚠ 可用上下文 ≈ 84%</text>

  <!-- EAGLE-3 Tree -->
  <text x="120" y="930" font-family="PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#9333ea">EAGLE-3（树形投机）</text>
  <rect x="120" y="950" width="605" height="60" rx="8" fill="#2563eb"/>
  <rect x="725" y="950" width="50" height="60" rx="8" fill="#9333ea"/>
  <rect x="775" y="950" width="185" height="60" rx="8" fill="#d97706"/>
  <text x="422" y="990" font-family="PingFang SC, sans-serif" font-size="20" font-weight="600" fill="white" text-anchor="middle">主干 KV (72%)</text>
  <text x="750" y="990" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Draft</text>
  <text x="867" y="990" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">草稿树峰值(22%)</text>
  <text x="120" y="1040" font-family="PingFang SC, sans-serif" font-size="20" fill="#dc2626" font-weight="600">⚠ 可用上下文 ≈ 72%</text>

  <!-- Key Insight Box -->
  <rect x="80" y="1050" width="920" height="180" rx="16" fill="#fef2f2"/>
  <text x="540" y="1105" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#dc2626" text-anchor="middle">核心结论</text>
  <text x="540" y="1150" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">MTP 权重只多 1%，但 KV cache</text>
  <text x="540" y="1190" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">草稿槽位吃掉 16-28% 显存</text>

  <!-- Footer -->
  <text x="540" y="1280" font-family="PingFang SC, sans-serif" font-size="24" fill="#78716c" text-anchor="middle">GLM-5.2 · DeepSeek-V3 · EAGLE-3</text>
  <text x="540" y="1320" font-family="PingFang SC, sans-serif" font-size="20" fill="#a8a29e" text-anchor="middle">san-tian.github.io/blog</text>
</svg>