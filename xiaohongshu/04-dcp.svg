<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ddd6fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg4)"/>

  <!-- Title -->
  <rect x="40" y="60" width="1000" height="280" rx="20" fill="white" opacity="0.95"/>
  <text x="540" y="130" font-family="PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#6366f1" text-anchor="middle">DCP: 动态上下文并行</text>
  <text x="540" y="195" font-family="PingFang SC, sans-serif" font-size="42" font-weight="700" fill="#6366f1" text-anchor="middle">破解长上下文训练难题</text>
  <text x="540" y="260" font-family="PingFang SC, sans-serif" font-size="26" fill="#78716c" text-anchor="middle">SOSP'25 论文解读</text>

  <!-- Problem -->
  <rect x="80" y="400" width="920" height="200" rx="16" fill="#fef2f2" opacity="0.95"/>
  <text x="540" y="460" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#dc2626" text-anchor="middle">❌ 传统方案的困境</text>
  <text x="540" y="510" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">静态并行配置 → 序列长度变化时通信低效</text>
  <text x="540" y="555" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">稀疏注意力 mask → 负载严重不均衡</text>

  <!-- Solution -->
  <rect x="80" y="640" width="920" height="300" rx="16" fill="white" opacity="0.95"/>
  <text x="540" y="705" font-family="PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#059669" text-anchor="middle">✓ DCP 动态解决方案</text>

  <rect x="140" y="750" width="800" height="80" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="540" y="800" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">细粒度块级分区 + 超图分区优化</text>

  <rect x="140" y="860" width="800" height="60" rx="10" fill="#eff6ff"/>
  <text x="540" y="900" font-family="PingFang SC, sans-serif" font-size="20" fill="#1c1917" text-anchor="middle">为每个 batch 动态生成最优并行配置</text>

  <!-- Performance -->
  <rect x="80" y="980" width="920" height="240" rx="16" fill="#fef3c7" opacity="0.95"/>
  <text x="540" y="1040" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">🚀 加速效果</text>

  <text x="280" y="1100" font-family="PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#1c1917" text-anchor="middle">Causal Mask</text>
  <text x="280" y="1145" font-family="PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#ea580c" text-anchor="middle">1.19×–2.45×</text>
  <text x="280" y="1185" font-family="PingFang SC, sans-serif" font-size="20" fill="#78716c" text-anchor="middle">训练加速</text>

  <text x="800" y="1100" font-family="PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#1c1917" text-anchor="middle">Sparse Mask</text>
  <text x="800" y="1145" font-family="PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#dc2626" text-anchor="middle">2.15×–3.77×</text>
  <text x="800" y="1185" font-family="PingFang SC, sans-serif" font-size="20" fill="#78716c" text-anchor="middle">训练加速</text>

  <!-- Use Cases -->
  <rect x="80" y="1260" width="920" height="50" rx="10" fill="#dbeafe"/>
  <text x="540" y="1295" font-family="PingFang SC, sans-serif" font-size="20" fill="#1c1917" text-anchor="middle">适用于：长上下文预训练 · 指令微调 · 变长序列场景</text>

  <!-- Footer -->
  <text x="540" y="1330" font-family="PingFang SC, sans-serif" font-size="18" fill="#a8a29e" text-anchor="middle">SOSP'25 · Context Parallelism</text>
</svg>