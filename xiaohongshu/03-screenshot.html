<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>GLM-5.2 H200</title>
<style>
body{margin:0;padding:40px;background:linear-gradient(135deg,#fef3c7,#fed7aa);font-family:"PingFang SC","Microsoft YaHei",sans-serif;width:1080px;height:1350px;box-sizing:border-box}
.card{background:#fff;border-radius:20px;padding:40px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
h1{font-size:48px;font-weight:700;color:#ea580c;margin:0 0 10px;text-align:center;line-height:1.3}
.subtitle{font-size:26px;color:#78716c;text-align:center;margin-bottom:40px}
.section-title{font-size:32px;font-weight:700;color:#1c1917;text-align:center;margin:30px 0 25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px}
.item{padding:30px;border-radius:12px;border:2px solid;text-align:center}
.item-title{font-size:26px;font-weight:700;margin-bottom:10px}
.item-subtitle{font-size:18px;color:#1c1917;margin-bottom:5px}
.item-desc{font-size:16px;color:#78716c}
.item1{background:#eff6ff;border-color:#3b82f6}
.item1 .item-title{color:#2563eb}
.item2{background:#fef3c7;border-color:#f59e0b}
.item2 .item-title{color:#d97706}
.item3{background:#f0fdf4;border-color:#10b981}
.item3 .item-title{color:#059669}
.item4{background:#fef2f2;border-color:#dc2626}
.item4 .item-title{color:#dc2626}
.item5{background:#faf5ff;border-color:#9333ea}
.item5 .item-title{color:#9333ea}
.item6{background:#fff7ed;border-color:#f97316}
.item6 .item-title{color:#ea580c}
.footer{background:#ecfdf5;padding:25px;border-radius:12px;text-align:center;margin-top:30px}
.footer-text{font-size:22px;color:#1c1917;font-weight:600}
</style>
</head>
<body>
<div class="card">
<h1>H200 上服务<br>GLM-5.2 智能体负载</h1>
<div class="subtitle">llm-d 工程实践与成本测算</div>

<div class="section-title">六项核心能力组合</div>

<div class="grid">
  <div class="item item1">
    <div class="item-title">MLA</div>
    <div class="item-subtitle">多头潜在注意力</div>
    <div class="item-desc">降低 KV cache 开销</div>
  </div>
  <div class="item item2">
    <div class="item-title">Wide-EP</div>
    <div class="item-subtitle">专家并行</div>
    <div class="item-desc">单机扩展到 8 卡</div>
  </div>
  <div class="item item3">
    <div class="item-title">前缀路由</div>
    <div class="item-subtitle">Prefix Routing</div>
    <div class="item-desc">复用 system prompt</div>
  </div>
  <div class="item item4">
    <div class="item-title">CPU 卸载</div>
    <div class="item-subtitle">KV Offload</div>
    <div class="item-desc">扩大上下文容量</div>
  </div>
  <div class="item item5">
    <div class="item-title">P-D 分池</div>
    <div class="item-subtitle">Prefill/Decode 分离</div>
    <div class="item-desc">提升吞吐</div>
  </div>
  <div class="item item6">
    <div class="item-title">MTP</div>
    <div class="item-subtitle">多 token 预测</div>
    <div class="item-desc">投机解码加速</div>
  </div>
</div>

<div class="footer">
  <div class="footer-text">64 GPU 配置 · 经验法则 · 调参指南</div>
</div>
</div>
</body>
</html>
