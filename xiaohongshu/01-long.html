<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=750, initial-scale=1.0">
<title>MTP KV Cache</title>
<style>
body{margin:0;padding:0;background:linear-gradient(180deg,#fef3c7,#fecaca);font-family:"PingFang SC","Microsoft YaHei",sans-serif;width:750px}
.container{padding:50px 40px}
.title{font-size:56px;font-weight:700;background:linear-gradient(90deg,#dc2626,#ea580c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 20px;text-align:center;line-height:1.2}
.subtitle{font-size:32px;color:#78716c;text-align:center;margin-bottom:60px}
.section{background:#fff;border-radius:24px;padding:45px;margin-bottom:35px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
.label{font-size:28px;font-weight:600;margin:0 0 15px;color:#1c1917}
.mem-bar{height:90px;border-radius:12px;display:flex;margin:20px 0;overflow:hidden;border:3px solid #e7e5e4}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:600;padding:0 15px;text-align:center}
.seg-backbone{background:#2563eb}
.seg-mtp{background:#dc2626}
.seg-tree{background:#d97706}
.result{font-size:24px;margin-top:12px;font-weight:600}
.result.ok{color:#059669}
.result.warn{color:#dc2626}
.insight{background:#fef2f2;padding:40px;border-radius:20px;border-left:6px solid #dc2626;margin-top:40px}
.insight-title{font-size:32px;font-weight:700;color:#dc2626;margin-bottom:20px;text-align:center}
.insight-text{font-size:26px;color:#1c1917;line-height:1.6;text-align:center}
.footer{text-align:center;color:#a8a29e;font-size:22px;margin:40px 0 50px}
</style>
</head>
<body>
<div class="container">

<div class="title">MTP 为什么会让<br>上下文减小？</div>
<div class="subtitle">KV cache 开销图解</div>

<div class="section">
<div class="label">Base 模型（无 MTP）</div>
<div class="mem-bar">
  <div class="seg seg-backbone" style="width:100%">主干 N 层 KV Cache</div>
</div>
<div class="result ok">✓ 可用上下文 = 100%</div>
</div>

<div class="section">
<div class="label">GLM-5.2（开启 7 步 MTP）</div>
<div class="mem-bar">
  <div class="seg seg-backbone" style="width:84%">主干 KV<br>(84%)</div>
  <div class="seg seg-mtp" style="width:6%">MTP<br>6%</div>
  <div class="seg seg-tree" style="width:10%">草稿<br>10%</div>
</div>
<div class="result warn">⚠ 可用上下文 ≈ 84%</div>
</div>

<div class="section">
<div class="label">EAGLE-3（树形投机）</div>
<div class="mem-bar">
  <div class="seg seg-backbone" style="width:72%">主干 KV<br>(72%)</div>
  <div class="seg seg-mtp" style="width:6%">Draft<br>6%</div>
  <div class="seg seg-tree" style="width:22%">草稿树<br>22%</div>
</div>
<div class="result warn">⚠ 可用上下文 ≈ 72%</div>
</div>

<div class="insight">
  <div class="insight-title">核心结论</div>
  <div class="insight-text">MTP 权重只多 1%<br>但 KV cache 草稿槽位<br>吃掉 16-28% 显存</div>
</div>

<div class="footer">GLM-5.2 · DeepSeek-V3 · EAGLE-3</div>

</div>
</body>
</html>
