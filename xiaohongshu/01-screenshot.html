<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>MTP KV Cache</title>
<style>
body{margin:0;padding:40px;background:linear-gradient(135deg,#fef3c7,#fecaca);font-family:"PingFang SC","Microsoft YaHei",sans-serif;width:1080px;height:1350px;box-sizing:border-box}
.card{background:#fff;border-radius:20px;padding:40px;margin-bottom:30px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
h1{font-size:52px;font-weight:700;background:linear-gradient(90deg,#dc2626,#ea580c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0 0 15px;text-align:center}
.subtitle{font-size:28px;color:#78716c;text-align:center;margin-bottom:40px}
.mem-bar{height:80px;border-radius:12px;display:flex;margin:20px 0;overflow:hidden;border:2px solid #e7e5e4}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:600}
.seg-backbone{background:#2563eb}
.seg-mtp{background:#dc2626}
.seg-tree{background:#d97706}
.label{font-size:22px;font-weight:600;margin:25px 0 10px;color:#1c1917}
.result{font-size:20px;margin-top:8px;font-weight:600}
.result.ok{color:#059669}
.result.warn{color:#dc2626}
.insight{background:#fef2f2;padding:30px;border-radius:12px;border-left:5px solid #dc2626;margin-top:30px}
.insight-title{font-size:28px;font-weight:700;color:#dc2626;margin-bottom:15px}
.insight-text{font-size:22px;color:#1c1917;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h1>MTP 为什么会让上下文减小？</h1>
<div class="subtitle">KV cache 开销图解</div>

<div class="label">Base 模型（无 MTP）</div>
<div class="mem-bar">
  <div class="seg seg-backbone" style="width:100%">主干 N 层 KV Cache</div>
</div>
<div class="result ok">✓ 可用上下文 = 100%</div>

<div class="label">GLM-5.2（开启 7 步 MTP）</div>
<div class="mem-bar">
  <div class="seg seg-backbone" style="width:84%">主干 KV (84%)</div>
  <div class="seg seg-mtp" style="width:6%">MTP</div>
  <div class="seg seg-tree" style="width:10%">草稿</div>
</div>
<div class="result warn">⚠ 可用上下文 ≈ 84%</div>

<div class="label">EAGLE-3（树形投机）</div>
<div class="mem-bar">
  <div class="seg seg-backbone" style="width:72%">主干 KV (72%)</div>
  <div class="seg seg-mtp" style="width:6%">Draft</div>
  <div class="seg seg-tree" style="width:22%">草稿树</div>
</div>
<div class="result warn">⚠ 可用上下文 ≈ 72%</div>

<div class="insight">
  <div class="insight-title">核心结论</div>
  <div class="insight-text">MTP 权重只多 1%，但 KV cache 草稿槽位吃掉 16-28% 显存</div>
</div>
</div>
</body>
</html>
