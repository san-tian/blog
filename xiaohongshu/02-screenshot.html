<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>PD L2 Cache</title>
<style>
body{margin:0;padding:40px;background:linear-gradient(135deg,#dbeafe,#e0f2fe);font-family:"PingFang SC","Microsoft YaHei",sans-serif;width:1080px;height:1350px;box-sizing:border-box}
.card{background:#fff;border-radius:20px;padding:40px;margin-bottom:30px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
h1{font-size:50px;font-weight:700;color:#1d4ed8;margin:0 0 15px;text-align:center;line-height:1.3}
.subtitle{font-size:26px;color:#78716c;text-align:center;margin-bottom:40px}
.path-box{padding:35px;border-radius:16px;margin:25px 0;border:3px solid}
.path-a{background:#eff6ff;border-color:#3b82f6}
.path-b{background:#fef2f2;border-color:#dc2626}
.path-title{font-size:30px;font-weight:700;margin-bottom:20px}
.path-title.a{color:#2563eb}
.path-title.b{color:#dc2626}
.path-item{font-size:22px;margin:12px 0;color:#1c1917;line-height:1.6}
.path-result{font-size:22px;font-weight:700;margin-top:18px}
.path-result.ok{color:#059669}
.path-result.no{color:#dc2626}
.insight{background:#f0f9ff;padding:35px;border-radius:16px;border-left:5px solid #1d4ed8;margin-top:30px}
.insight-title{font-size:28px;font-weight:700;color:#1d4ed8;margin-bottom:15px;text-align:center}
.insight-text{font-size:22px;color:#1c1917;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>PD 分离中<br>decode 不需要 L2 缓存？</h1>
<div class="subtitle">SGLang 源码复盘</div>

<div class="path-box path-a">
  <div class="path-title a">路径 A：Prefill 跨机重传</div>
  <div class="path-item">• Prefill GPU → 8×IB 聚合 → Decode GPU</div>
  <div class="path-item">• 带宽：8 × 200 Gbps = 1600 Gbps</div>
  <div class="path-result ok">✓ 实测更快（8卡聚合带宽优势）</div>
</div>

<div class="path-box path-b">
  <div class="path-title b">路径 B：Decode 本地 L2 加载</div>
  <div class="path-item">• Host DRAM → PCIe 5.0 → Decode GPU</div>
  <div class="path-item">• 带宽：128 GB/s ≈ 1024 Gbps</div>
  <div class="path-result no">✗ 单链路带宽不如路径 A</div>
</div>

<div class="insight">
  <div class="insight-title">核心发现</div>
  <div class="insight-text">多卡 IB 聚合带宽 &gt; 单卡 PCIe 带宽<br>→ decode 直接从 prefill 拉 KV 更划算</div>
</div>
</div>
</body>
</html>
