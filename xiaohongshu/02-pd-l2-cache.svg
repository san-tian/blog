<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg2)"/>

  <!-- Title -->
  <rect x="40" y="60" width="1000" height="260" rx="20" fill="white" opacity="0.95"/>
  <text x="540" y="140" font-family="PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#1d4ed8" text-anchor="middle">PD 分离中</text>
  <text x="540" y="210" font-family="PingFang SC, sans-serif" font-size="48" font-weight="700" fill="#1d4ed8" text-anchor="middle">decode 不需要 L2 缓存？</text>
  <text x="540" y="270" font-family="PingFang SC, sans-serif" font-size="26" fill="#78716c" text-anchor="middle">SGLang 源码复盘</text>

  <!-- Main Content -->
  <rect x="80" y="380" width="920" height="680" rx="16" fill="white" opacity="0.95"/>

  <text x="540" y="450" font-family="PingFang SC, sans-serif" font-size="32" font-weight="600" fill="#1c1917" text-anchor="middle">两条 KV 缓存路径对比</text>

  <!-- Path A -->
  <rect x="140" y="500" width="800" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="180" y="545" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#2563eb">路径 A：Prefill 跨机重传</text>
  <text x="180" y="590" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917">• Prefill GPU → 8×IB 聚合 → Decode GPU</text>
  <text x="180" y="635" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917">• 带宽：8 × 200 Gbps = 1600 Gbps</text>
  <text x="180" y="680" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#059669">✓ 实测更快（8卡聚合带宽优势）</text>

  <!-- Path B -->
  <rect x="140" y="760" width="800" height="220" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="180" y="805" font-family="PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#dc2626">路径 B：Decode 本地 L2 加载</text>
  <text x="180" y="850" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917">• Host DRAM → PCIe 5.0 → Decode GPU</text>
  <text x="180" y="895" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917">• 带宽：128 GB/s ≈ 1024 Gbps</text>
  <text x="180" y="940" font-family="PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#dc2626">✗ 单链路带宽不如路径 A</text>

  <!-- Bottom Insight -->
  <rect x="80" y="1100" width="920" height="160" rx="16" fill="#f0f9ff"/>
  <text x="540" y="1155" font-family="PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#1d4ed8" text-anchor="middle">核心发现</text>
  <text x="540" y="1205" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">多卡 IB 聚合带宽 &gt; 单卡 PCIe 带宽</text>
  <text x="540" y="1245" font-family="PingFang SC, sans-serif" font-size="22" fill="#1c1917" text-anchor="middle">→ decode 直接从 prefill 拉 KV 更划算</text>

  <!-- Footer -->
  <text x="540" y="1300" font-family="PingFang SC, sans-serif" font-size="20" fill="#a8a29e" text-anchor="middle">SGLang · DecodeKVCacheOffloadManager</text>
</svg>