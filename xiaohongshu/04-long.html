<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=750, initial-scale=1.0">
<title>DCP</title>
<style>
body{margin:0;padding:0;background:linear-gradient(180deg,#e0e7ff,#ddd6fe);font-family:"PingFang SC","Microsoft YaHei",sans-serif;width:750px}
.container{padding:50px 40px}
.title{font-size:50px;font-weight:700;color:#6366f1;margin:0 0 20px;text-align:center;line-height:1.3}
.subtitle{font-size:30px;color:#78716c;text-align:center;margin-bottom:60px}
.problem-box{background:#fef2f2;padding:40px;border-radius:20px;border-left:6px solid #dc2626;margin-bottom:35px}
.problem-title{font-size:32px;font-weight:700;color:#dc2626;margin-bottom:20px;text-align:center}
.problem-item{font-size:24px;color:#1c1917;margin:15px 0;line-height:1.7}
.solution-box{background:#f0fdf4;padding:40px;border-radius:20px;border-left:6px solid #10b981;margin-bottom:35px}
.solution-title{font-size:32px;font-weight:700;color:#059669;margin-bottom:20px;text-align:center}
.solution-item{font-size:24px;color:#1c1917;margin:15px 0;text-align:center;line-height:1.7}
.perf-box{background:#fef3c7;padding:45px;border-radius:20px;margin-bottom:35px}
.perf-title{font-size:32px;font-weight:700;color:#d97706;margin-bottom:30px;text-align:center}
.perf-item{text-align:center;padding:35px;background:#fff;border-radius:16px;margin-bottom:25px;border:3px solid #e7e5e4}
.perf-label{font-size:28px;font-weight:600;color:#1c1917;margin-bottom:15px}
.perf-value{font-size:48px;font-weight:700;margin:15px 0}
.perf-value.v1{color:#ea580c}
.perf-value.v2{color:#dc2626}
.perf-desc{font-size:22px;color:#78716c}
.usecase{background:#dbeafe;padding:35px;border-radius:16px;text-align:center;margin-bottom:35px}
.usecase-text{font-size:24px;color:#1c1917;line-height:1.7}
.footer{text-align:center;color:#a8a29e;font-size:22px;margin:20px 0 50px}
</style>
</head>
<body>
<div class="container">

<div class="title">DCP: 动态上下文并行<br>破解长上下文训练难题</div>
<div class="subtitle">SOSP'25 论文解读</div>

<div class="problem-box">
  <div class="problem-title">❌ 传统方案的困境</div>
  <div class="problem-item">静态并行配置<br>→ 序列长度变化时通信低效</div>
  <div class="problem-item">稀疏注意力 mask<br>→ 负载严重不均衡</div>
</div>

<div class="solution-box">
  <div class="solution-title">✓ DCP 动态解决方案</div>
  <div class="solution-item">细粒度块级分区<br>+ 超图分区优化</div>
  <div class="solution-item">为每个 batch<br>动态生成最优并行配置</div>
</div>

<div class="perf-box">
  <div class="perf-title">🚀 加速效果</div>
  <div class="perf-item">
    <div class="perf-label">Causal Mask</div>
    <div class="perf-value v1">1.19×–2.45×</div>
    <div class="perf-desc">训练加速</div>
  </div>
  <div class="perf-item">
    <div class="perf-label">Sparse Mask</div>
    <div class="perf-value v2">2.15×–3.77×</div>
    <div class="perf-desc">训练加速</div>
  </div>
</div>

<div class="usecase">
  <div class="usecase-text">适用于：长上下文预训练<br>指令微调 · 变长序列场景</div>
</div>

<div class="footer">SOSP'25 · Context Parallelism</div>

</div>
</body>
</html>
