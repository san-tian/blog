<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<title>DCP</title>
<style>
body{margin:0;padding:40px;background:linear-gradient(135deg,#e0e7ff,#ddd6fe);font-family:"PingFang SC","Microsoft YaHei",sans-serif;width:1080px;height:1350px;box-sizing:border-box}
.card{background:#fff;border-radius:20px;padding:40px;margin-bottom:25px;box-shadow:0 10px 40px rgba(0,0,0,0.1)}
h1{font-size:48px;font-weight:700;color:#6366f1;margin:0 0 10px;text-align:center;line-height:1.3}
.subtitle{font-size:26px;color:#78716c;text-align:center;margin-bottom:35px}
.problem-box{background:#fef2f2;padding:30px;border-radius:12px;border-left:5px solid #dc2626;margin-bottom:25px}
.problem-title{font-size:28px;font-weight:700;color:#dc2626;margin-bottom:15px;text-align:center}
.problem-item{font-size:22px;color:#1c1917;margin:10px 0;line-height:1.6}
.solution-box{background:#f0fdf4;padding:30px;border-radius:12px;border-left:5px solid #10b981;margin-bottom:25px}
.solution-title{font-size:28px;font-weight:700;color:#059669;margin-bottom:20px;text-align:center}
.solution-item{font-size:22px;color:#1c1917;margin:12px 0;text-align:center;line-height:1.6}
.perf-box{background:#fef3c7;padding:35px;border-radius:12px}
.perf-title{font-size:28px;font-weight:700;color:#d97706;margin-bottom:25px;text-align:center}
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}
.perf-item{text-align:center;padding:25px;background:#fff;border-radius:12px}
.perf-label{font-size:24px;font-weight:600;color:#1c1917;margin-bottom:10px}
.perf-value{font-size:38px;font-weight:700;margin:10px 0}
.perf-value.v1{color:#ea580c}
.perf-value.v2{color:#dc2626}
.perf-desc{font-size:18px;color:#78716c}
</style>
</head>
<body>
<div class="card">
<h1>DCP: 动态上下文并行<br>破解长上下文训练难题</h1>
<div class="subtitle">SOSP'25 论文解读</div>

<div class="problem-box">
  <div class="problem-title">❌ 传统方案的困境</div>
  <div class="problem-item">静态并行配置 → 序列长度变化时通信低效</div>
  <div class="problem-item">稀疏注意力 mask → 负载严重不均衡</div>
</div>

<div class="solution-box">
  <div class="solution-title">✓ DCP 动态解决方案</div>
  <div class="solution-item">细粒度块级分区 + 超图分区优化</div>
  <div class="solution-item">为每个 batch 动态生成最优并行配置</div>
</div>
</div>

<div class="card">
<div class="perf-box">
  <div class="perf-title">🚀 加速效果</div>
  <div class="perf-grid">
    <div class="perf-item">
      <div class="perf-label">Causal Mask</div>
      <div class="perf-value v1">1.19×–2.45×</div>
      <div class="perf-desc">训练加速</div>
    </div>
    <div class="perf-item">
      <div class="perf-label">Sparse Mask</div>
      <div class="perf-value v2">2.15×–3.77×</div>
      <div class="perf-desc">训练加速</div>
    </div>
  </div>
</div>
</div>
</body>
</html>
